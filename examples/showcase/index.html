<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mini-vue 展示页 — 一个自研的 Vue3 内核</title>
    <style>
      body { font-family: system-ui; padding: 24px; color: #334155; max-width: 760px; margin: 0 auto; line-height: 1.6; }
      h1 { font-size: 22px; }
      h2 { font-size: 16px; border-bottom: 1px solid #e2e8f0; padding-bottom: 6px; margin-top: 28px; }
      .badge { display: inline-block; background: #0f172a; color: #fff; border-radius: 99px; padding: 2px 10px; font-size: 12px; margin-right: 6px; }
      button { border: 1px solid #cbd5e1; border-radius: 6px; padding: 4px 12px; background: #f8fafc; cursor: pointer; }
      .card { border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px; margin: 8px 0; }
      input, select { border: 1px solid #cbd5e1; border-radius: 6px; padding: 4px 8px; }
      pre { background: #f1f5f9; border-radius: 8px; padding: 10px; font-size: 12px; overflow: auto; }
      .counter { font-weight: 700; font-size: 18px; }
      .v-enter-active, .v-leave-active { transition: opacity .3s; }
      .v-enter-from, .v-leave-to { opacity: 0; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
